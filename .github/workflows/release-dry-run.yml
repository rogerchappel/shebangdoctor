name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - releasebox.config.json
      - package.json
      - package-lock.json
      - README.md
      - scripts/documented-install-smoke.sh
      - .github/workflows/release*.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Build release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifacts
          artifact=$(npm pack --silent --pack-destination release-artifacts)
          test -n "$artifact"
          test "$(printf '%s\n' "$artifact" | wc -l)" -eq 1
          artifact="release-artifacts/$artifact"
          test -f "$artifact"
          case "$artifact" in *.tgz) ;; *) exit 1 ;; esac
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Verify release artifact install
        shell: bash
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          npm install --prefix "$consumer" --ignore-scripts "${{ steps.pack.outputs.artifact }}"
          "$consumer/node_modules/.bin/shebangdoctor" --help >/dev/null
      - name: Release notes preview
        run: |
          node /tmp/releasebox/bin/releasebox.js notes . > release-notes-preview.md
          cat release-notes-preview.md
      - name: Publish release notes summary
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
